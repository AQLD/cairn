name: image

# Publishes the engine image `cairn up` runs: ghcr.io/aqld/cairnd:latest from
# main, and :X.Y.Z for release tags. Both architectures, so Apple Silicon
# laptops and x86 servers pull the same name.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        shell: bash
        run: |
          img=ghcr.io/$(echo "${{ github.repository_owner }}" | tr A-Z a-z)/cairnd
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "tags=$img:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$img:latest,$img:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
