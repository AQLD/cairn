name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # Linux pinned to the release every Cairn host runs (deploy/versions.env)
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -short -count=1 ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-24.04'
        run: go test -race -short -count=1 ./...
      - name: Test plan is up to date
        if: matrix.os == 'ubuntu-24.04'
        run: |
          go run ./internal/tools/testplan > docs/test-plan.md
          git diff --exit-code docs/test-plan.md || (echo "run 'make plan' and commit docs/test-plan.md" && exit 1)

  gvisor:
    # The acceptance suite on real gVisor sandboxes (as root: runsc needs it),
    # with disk images, memory limits, full saves and the kill -9 harness.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous engine is built from history (G10.6)
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gVisor (deploy/versions.env)
        run: sudo deploy/install-gvisor.sh
      - name: Build the previous engine (what this change upgrades from)
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/previous" "$BASE"
          (cd "$RUNNER_TEMP/previous" && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/previous-bin/" ./cmd/cairnd ./cmd/cairn-init)
          echo "upgrading from $(git log -1 --format='%h %s' "$BASE")" >> "$GITHUB_STEP_SUMMARY"
      - name: Acceptance suite on gVisor
        shell: bash
        run: |
          sudo env "PATH=$PATH" \
            CAIRN_PREVIOUS_CAIRND="$RUNNER_TEMP/previous-bin/cairnd" CAIRN_PREVIOUS_INIT="$RUNNER_TEMP/previous-bin/cairn-init" \
            devenv/accept-runsc.sh "$PWD" -v -timeout 35m -run TestEndGoals 2>&1 | tee accept.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### gVisor acceptance"
            echo "passed: $(grep -E -- '--- PASS: .*G[0-9]+\.[0-9]' accept.log | grep -vc /self)"
            echo "skipped: $(grep -E -- '--- SKIP' accept.log | grep -vc /self)"
            echo '```'
            grep -E -- '--- FAIL|panic:' accept.log | grep -v /self || echo "no failures"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gvisor-accept-log
          path: accept.log
