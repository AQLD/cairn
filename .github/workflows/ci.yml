name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # Linux pinned to the release every Cairn host runs (deploy/versions.env)
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -short -count=1 ./...
      - name: Test plan is up to date
        if: matrix.os == 'ubuntu-24.04'
        run: |
          go run ./internal/tools/testplan > docs/test-plan.md
          git diff --exit-code docs/test-plan.md || (echo "run 'make plan' and commit docs/test-plan.md" && exit 1)
