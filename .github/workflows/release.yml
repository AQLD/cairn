name: release

# On a version tag: the cairn CLI for macOS and Linux, and cairnd + cairn-init
# for Linux (deploy/release.sh), each with a CycloneDX bill of materials, and
# SHA256SUMS over everything, signed keylessly with Sigstore (the signature is
# this workflow's GitHub identity, recorded in the public transparency log).
# install.sh checks the signature when cosign is installed; docs/install.md
# shows how to check by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # Sigstore keyless signing

jobs:
  binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: deploy/release.sh "$GITHUB_REF_NAME" dist
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
