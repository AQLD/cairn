name: release

# On a version tag: the cairn CLI for macOS and Linux, and cairnd + cairn-init
# for Linux, with SHA-256 sums, attached to a GitHub release. (Signing and a
# bill of materials are G10.8.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME}
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*} arch=${target#*/}
            dir=cairn_${ver}_${os}_${arch}
            mkdir -p "$dir"
            cmds=./cmd/cairn
            [[ $os == linux ]] && cmds="./cmd/cairn ./cmd/cairnd ./cmd/cairn-init"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.buildVersion=$ver" -o "$dir/" $cmds
            cp LICENSE README.md "$dir/"
            tar -czf "dist/$dir.tar.gz" "$dir"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
