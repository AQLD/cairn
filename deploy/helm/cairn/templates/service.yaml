apiVersion: v1
kind: Service
metadata:
  name: {{ include "cairn.fullname" . }}
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cairn.selector" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.port }}
      targetPort: api
---
# Headless: stable DNS for the StatefulSet pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cairn.fullname" . }}-headless
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "cairn.selector" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.port }}
      targetPort: api
