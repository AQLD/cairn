{{- if not .Values.token.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cairn.fullname" . }}-token
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "set token.value (or token.existingSecret): the Cairn API runs commands and must not be open" .Values.token.value | quote }}
{{- end }}
