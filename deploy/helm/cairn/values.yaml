# Cairn engine on Kubernetes.
#
# One engine owns its workspaces and saves (until the multi-server scheduler).
# The default runs one engine as a StatefulSet with a persistent volume: pods
# can restart and move without losing workspaces or saves.

image:
  repository: ghcr.io/aqld/cairnd
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# API token. Required: the API runs commands. Either point to an existing
# Secret (key "token") or let the chart create one from `value`.
token:
  existingSecret: ""
  value: ""

# runsc (gVisor) isolates workspaces. "host" is for development only: no isolation.
runtime: runsc

# Templates are root filesystems workspaces start from. Each listed image is
# turned into a template at startup by an init container (the image needs tar).
templates:
  - name: python
    image: python:3.12-slim
  - name: node
    image: node:22-slim
defaultTemplate: python

# Pausing: a full save that frees a workspace's memory; the next command or
# write wakes it with its processes, transparently.
pause:
  # Pause workspaces unused this long ("0" never pauses idle workspaces).
  idle: 30m
  # On pod shutdown (drain, upgrade, rollout) pause every running workspace, so
  # agents' processes survive the pod moving. Needs time: see gracePeriod.
  onShutdown: true
  # Upper bound on shutdown, pausing included. Must stay below gracePeriod.
  shutdownTimeout: 150s
  # Pod terminationGracePeriodSeconds.
  gracePeriod: 180

# Workspace disks: each workspace's files live in a sparse ext4 image of its
# size, so one workspace cannot fill the volume for the others. Images use
# volume space only for what is stored.
disk:
  # Size of workspaces created without one, in MB.
  defaultMB: 10240
  # false keeps workspaces in plain folders with no size limit.
  images: true

# Saves in S3-compatible object storage (AWS S3, R2, Spaces, GCS, MinIO,
# SeaweedFS), so they outlive the node and the volume: every save is uploaded
# in the background and verified when downloaded. A new install pointed at the
# same bucket learns the saves and can copy them into new workspaces.
saveStore:
  # e.g. s3://my-bucket/cairn?region=eu-west-1 or
  # s3://bucket/prefix?endpoint=https://nyc3.digitaloceanspaces.com&region=nyc3
  url: ""
  # Secret with keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
  existingSecret: ""

# The state database (records of every workspace and save) is checked at
# startup and backed up hourly next to itself. If it is ever damaged the engine
# refuses to start; set this to true to rebuild it from the backup and the
# volume. It only acts on a missing or damaged database, so it can stay on.
restoreState: false

# How long deleted saves can be undeleted before they are purged.
retention: 168h
# How often every save's checksums are re-verified.
scrubInterval: 6h

persistence:
  size: 50Gi
  storageClass: ""     # cluster default
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  port: 7420

# gVisor needs to create namespaces, cgroups and mounts, so the engine pod is
# privileged. Workspaces themselves run inside gVisor sandboxes: agent code
# never touches the node's kernel directly. Workspaces with network enabled
# reach the outside through this pod's network, so your NetworkPolicies apply.
securityContext:
  privileged: true

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  # Limits cap the engine and every workspace sandbox it runs.
  limits: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "7420"
  prometheus.io/path: /metrics

nodeSelector: {}
tolerations: []
affinity: {}
