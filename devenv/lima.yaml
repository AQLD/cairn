# Cairn dev VM: Ubuntu 24.04, the same release as the DigitalOcean droplets,
# set up by the same deploy/host-setup.sh. Created by `devenv/dev.sh up`, which
# also mounts this repo (writable) at the same path as on the Mac.
#
# The one difference from the droplets is the CPU: on Apple Silicon this VM is
# arm64, the droplets are x86_64. Cross-CPU portability is only tested there.
vmType: vz
cpus: 4
memory: 6GiB
disk: 30GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64
mountType: virtiofs
mounts: [] # set by dev.sh
networks:
  # user-v2 lets the two dev VMs reach each other, like droplets on a private network
  - lima: user-v2
containerd:
  system: false
  user: false
